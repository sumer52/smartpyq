# Docker Compose configuration for Smart PYQ development environment
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartpyq_postgres
    environment:
      POSTGRES_DB: smartpyq
      POSTGRES_USER: smartpyq_user
      POSTGRES_PASSWORD: smartpyq_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpyq_user -d smartpyq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpyq_network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: smartpyq_redis
    command: redis-server --appendonly yes --requirepass smartpyq_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "smartpyq_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpyq_network

  # MinIO for local S3-compatible storage (development only)
  minio:
    image: minio/minio:latest
    container_name: smartpyq_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - smartpyq_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smartpyq_app
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://smartpyq_user:smartpyq_password@postgres:5432/smartpyq
      - REDIS_URL=redis://:smartpyq_redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:smartpyq_redis_password@redis:6379/1
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_api_key}
      - AWS_S3_BUCKET=smartpyq-dev
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_ENDPOINT_URL=http://minio:9000
      - ALLOWED_HOSTS=localhost,127.0.0.1,app
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - app_uploads:/app/uploads
      - app_temp:/app/temp
      - app_logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smartpyq_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smartpyq_celery_worker
    command: ["python", "-m", "celery", "worker", "-A", "app.workers.celery_app", "--loglevel=info", "--concurrency=2"]
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://smartpyq_user:smartpyq_password@postgres:5432/smartpyq
      - REDIS_URL=redis://:smartpyq_redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:smartpyq_redis_password@redis:6379/1
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_api_key}
      - AWS_S3_BUCKET=smartpyq-dev
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_ENDPOINT_URL=http://minio:9000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ./app:/app/app
      - app_uploads:/app/uploads
      - app_temp:/app/temp
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - smartpyq_network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smartpyq_celery_beat
    command: ["python", "-m", "celery", "beat", "-A", "app.workers.celery_app", "--loglevel=info"]
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://smartpyq_user:smartpyq_password@postgres:5432/smartpyq
      - REDIS_URL=redis://:smartpyq_redis_password@redis:6379/0
      - CELERY_BROKER_URL=redis://:smartpyq_redis_password@redis:6379/1
      - JWT_SECRET=dev_jwt_secret_change_in_production
    volumes:
      - ./app:/app/app
      - app_logs:/app/logs
      - celery_beat_data:/app/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartpyq_network
    restart: unless-stopped

  # Celery Flower (Task Monitor)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smartpyq_flower
    command: ["python", "-m", "celery", "flower", "-A", "app.workers.celery_app", "--port=5555"]
    environment:
      - CELERY_BROKER_URL=redis://:smartpyq_redis_password@redis:6379/1
      - FLOWER_BASIC_AUTH=admin:flower_password_123
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smartpyq_network
    restart: unless-stopped

  # Database Migration Service (runs once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: smartpyq_migrate
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql://smartpyq_user:smartpyq_password@postgres:5432/smartpyq
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartpyq_network
    restart: "no"

  # Nginx Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: smartpyq_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - smartpyq_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  app_uploads:
    driver: local
  app_temp:
    driver: local
  app_logs:
    driver: local
  celery_beat_data:
    driver: local

networks:
  smartpyq_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

